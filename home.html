<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title -->
    <title>Github-Issue-Tracker</title>

    <!-- fav icon -->
    <link rel="shortcut icon" href="assets/icons8-github-32.png" type="image/x-icon">

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- tailwind CDN-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>

</head>

<body class="bg-gray-200">

    <!-- header section -->
    <header class="flex justify-between items-center py-5 border border-[#E9E9E9] bg-[#FFFFFF] px-10 shadow flex-wrap gap-4">
        <div>
            <span><i class="fa-brands fa-github text-2xl"></i></span>
            <span class="text-[#1F2937] font-bold text-2xl">GitHub Issues Tracker</span>
        </div>

        <div class="flex gap-5">
            <label class="input">
                <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </g>
                </svg>

                <input type="search" required placeholder="Search issues..." />
            </label>

            <button class="btn btn-primary">+ New Issue</button>
        </div>
    </header>


    <!-- main section -->
    <main class="pb-[60px]">

        <!--Tab button section -->
        <section id="all_btns" class="w-[90vw] mx-auto bg-[#FFFFFF] border border-gray-200 rounded-md p-6 shadow mt-[60px] flex gap-8">
            <button id="all_btn" class="btn btn-outline all-btns">All</button>

            <button id="open_btn" class="btn btn-outline open-btns">Open</button>

            <button id="closed_btn" class="btn btn-outline closed-btns">Closed</button>
            
        </section>


        <!-- issue (Tab) section -->
        <section id=""
            class="w-[90vw] mx-auto bg-[#FFFFFF] border border-gray-200 rounded-md p-6 shadow mt-8">

            <div class="flex justify-between items-center flex-wrap gap-6">
                <div class="flex items-center gap-2">
                    <div class="bg-[#ECE4FF] p-2 rounded-full">
                        <img src="assets/Aperture.png" alt="">
                    </div>

                    <div>
                        <h2 class="text-[20px] text-[#1F2937] font-semibold"><span id="count_cards">50</span> Issues</h2>
                        <p class="text-[#64748B] text-[16px]">Track and manage your project issues</p>
                    </div>
                </div>

                <div class="flex gap-10">
                    <span><i class="fa-solid fa-circle" style="color: green;"></i> Open</span>
                    <span><i class="fa-solid fa-circle" style="color: rgb(16, 16, 214);"></i> Closed</span>
                </div>

            </div>

        </section>


        <!-- all cards showing section -->
        <section id="card_container" class="bg-[#FBFBFB] rounded-md w-[90vw] mt-2 mx-auto grid md:grid-cols-4 grid-cols-1 gap-5 p-5">

        </section>


        <!-- modal section -->
        <!-- Open the modal using ID.showModal() method -->
        <dialog id="my_modal" class="modal modal-middle">
            <div class="modal-box">
                <div id="modal_container" class="space-y-2">
                    
                </div>

                <div class="modal-action">
                    <form method="dialog">
                        <!-- if there is a button in form, it will close the modal -->
                        <button class="btn btn-primary">Close</button>
                    </form>
                </div>
            </div>
        </dialog>

    </main>


    

<script src="home.js"></script>
</body>

</html>
